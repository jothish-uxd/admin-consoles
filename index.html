<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Consoles — Pattern Library</title>
  <meta name="description" content="A personal library of admin console UI patterns: user management, roles, assets, creation flows, destructive actions and more.">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="home">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="mobile-topbar">
    <strong>Admin Consoles</strong>
    <button type="button" class="menu-button" id="menu-button" aria-controls="sidebar" aria-expanded="false">Menu</button>
  </div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Site navigation"></aside>
    <main class="main" id="main" tabindex="-1">
      <div class="container">
        <header class="hero">
          <p class="eyebrow">Personal pattern library</p>
          <h1>How admins add, change and remove things.</h1>
          <p class="hero-copy">Screens from real admin consoles, grouped by the job the admin is doing rather than by product. Pick a category to see the patterns worth collecting and the references saved so far.</p>
          <ul class="stats" id="stats"></ul>
        </header>

        <div class="toolbar" role="search">
          <div class="search">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <label class="visually-hidden" for="search">Search categories and patterns</label>
            <input id="search" type="search" placeholder="Search patterns — press /" autocomplete="off">
          </div>
          <div class="chips" id="chips" role="group" aria-label="Filter by group"></div>
        </div>
        <p class="visually-hidden" id="results-status" role="status" aria-live="polite"></p>

        <div id="categories"></div>
      </div>
    </main>
  </div>
  <script src="data/categories.js"></script>
  <script src="assets/wireframes.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
