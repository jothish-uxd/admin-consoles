# Publishes the site to GitHub Pages from main only:
#   main -> https://jothish-uxd.github.io/admin-consoles/
# Work in progress on other branches (such as v3-videos) is not published;
# it's previewed privately through the Claude artifact instead.
# Needs Settings -> Pages -> Source set to "GitHub Actions".
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude .git --exclude .github main/ _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
