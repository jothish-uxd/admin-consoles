# Publishes the site to GitHub Pages:
#   main       -> https://jothish-uxd.github.io/admin-consoles/
#   v3-videos  -> https://jothish-uxd.github.io/admin-consoles/v3-videos/   (preview)
# Runs on every push to either branch, so both stay current.
# Needs Settings -> Pages -> Source set to "GitHub Actions".
# To preview another branch, add it to `branches` and to the copy step below.
name: Publish site

on:
  push:
    branches: [main, v3-videos]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Check out v3-videos
        uses: actions/checkout@v4
        with:
          ref: v3-videos
          path: preview
      - name: Assemble site
        run: |
          mkdir -p _site/v3-videos
          rsync -a --exclude .git --exclude .github main/ _site/
          rsync -a --exclude .git --exclude .github --exclude motion preview/ _site/v3-videos/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
