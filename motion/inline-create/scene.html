<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inline create · motion scene</title>
<!--
  Source for media/creation-flows/inline-create.mp4.
  Built on motion/shared (console.css, motion.js): see motion.js for how a scene is put together.
  Open this file in a browser and add ?play to watch it live.
  Way in: Content / Tags → Add tag (the same Tags page as the Tags & metadata clip).

  Follows the Inline create card (data/guidance-actions.js):
  - a focused row in place; Enter / Esc shown (do 1-2)
  - Saving…, Saved and error on the row; pinned at top as New (do 3, avoid 3, scale 1)
  - duplicate caught by the server; the row and text kept (avoid 2, scale 2)
  - Esc cancels the unsaved row
  - a full form for bigger items: New managed field (do 4)
-->
<link rel="stylesheet" href="../shared/console.css">
<style>
.main { padding: 0; }
.view { position: absolute; inset: 20px 32px; }
h1 { font-size: 20px; }
.hd { display: flex; align-items: center; gap: 10px; }
.hd h1 { flex: 1; }
.btn.sm { height: 32px; font-size: 12.5px; }
.tabs { margin-top: 14px; display: flex; gap: 22px; border-bottom: 1px solid var(--rule); font-size: 14px; }
.tabs div { padding: 0 0 10px; color: var(--soft); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs div.on { color: var(--ink); font-weight: 600; border-color: var(--ink); }
.bar { margin-top: 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--soft); width: 740px; }
.bar .sp { flex: 1; }
.bar a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
table.tg { margin-top: 10px; font-size: 13px; width: 740px; }
.tg td { height: 46px; white-space: nowrap; overflow: visible; }
.tg td:first-child { color: var(--ink); font-weight: 500; }
.tgn { display: inline-flex; align-items: center; gap: 7px; }
.tgn i { width: 9px; height: 9px; border-radius: 50%; }
tr.ed td { background: var(--subtle); }
.ein { height: 32px; width: 230px; border: 1.5px solid var(--ink); border-radius: 7px; display: inline-flex; align-items: center; padding: 0 10px; font-weight: 400; }
.ein.err { border-color: #b91c1c; }
.ein .c { width: 1.5px; height: 16px; background: var(--ink); margin-left: 1px; }
.hint { display: none; }
.st { display: inline-flex; gap: 5px; align-items: center; font-size: 12.5px; white-space: nowrap; }
.st svg { width: 12px; height: 12px; }
.st.e { color: #b91c1c; font-weight: 500; }
.new { font: 10px "Geist Mono", monospace; border: 1px solid var(--ink); border-radius: 999px; padding: 0 6px; margin-left: 8px; color: var(--ink); font-weight: 400; }
.erow td { height: 0; padding: 0; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="ok" viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="no" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4.6v4.2M8 11v.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
</defs></svg>
<div id="stage">
  <div class="win">
    <div class="top">
      <div class="brand"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="10" r="3" fill="currentColor"/></svg>Echo Base Console</div>
      <span class="crumb" data-path="Content / Tags"></span>
      <div class="me">Lavanya Sienna · Jedi Master <span class="av">LS</span></div>
    </div>
    <div class="nav" data-at="content" data-role="admin"></div>
    <div class="main">
      <div class="view">
        <div class="hd"><h1>Tags &amp; metadata</h1><span class="btn sm">Import taxonomy</span></div>
        <div class="tabs"><div>All content</div><div class="on">Tags</div><div>Storage</div><div>Trash</div></div>
        <div class="bar" id="bar"><span class="btn sm pri" id="addB">+ Add tag</span><span class="sp"></span>Need a controlled list? <a>New managed field</a></div>
        <table class="tg" id="tbl" style="table-layout:fixed"><colgroup><col style="width:300px"><col style="width:100px"><col></colgroup><thead><tr><th>Tag</th><th>Used on</th><th></th></tr></thead><tbody>
          <!-- new row 1 (rogue-one) -->
          <tr id="r1" style="display:none"><td><span id="c1"></span></td><td id="u1"></td><td id="s1"></td></tr>
          <!-- new row 2 (Hoth, rejected) -->
          <tr id="r2" class="ed" style="display:none"><td><span id="c2"></span></td><td></td><td id="s2"></td></tr>
          <tr><td><span class="tgn"><i style="background:#3b82f6"></i>Hoth</span></td><td>1,338 items</td><td></td></tr>
          <tr><td><span class="tgn"><i style="background:#16a34a"></i>Endor</span></td><td>430 items</td><td></td></tr>
          <tr><td><span class="tgn"><i style="background:#f59e0b"></i>Yavin IV</span></td><td>310 items</td><td></td></tr>
          <tr><td><span class="tgn"><i style="background:#a3a3a3"></i>Patrol</span></td><td>96 items</td><td></td></tr>
          <tr><td><span class="tgn"><i style="background:#a3a3a3"></i>Operations</span></td><td>88 items</td><td></td></tr>
        </tbody></table>
      </div>
    </div>
  </div>
</div>

<script src="../shared/motion.js"></script>
<script>
const { $, at, span } = Motion;

/* ---------- timeline (scene seconds) ---------- */
const T = {
  add1: 1.80, type1: [2.30, 3.20], enter1: 3.70, saved1: 4.40,
  add2: 6.20, type2: [6.70, 7.20], enter2: 7.70, err2: 8.20, esc2: 10.20,
  endCard: [11.8, 12.25], end: 13.3
};

function build() {
  // lay out a row while measuring, so the camera knows where rows sit
  const ab = at("addB"), tb = at("tbl"), br = at("bar");
  const MX = 640;
  const cur = [
    [0.00, 860, 620], [0.40, 860, 620], [1.65, ab[0], ab[1] + 3], [1.95, ab[0], ab[1] + 3], [2.40, ab[0] + 60, ab[1] + 40],
    [6.05, ab[0], ab[1] + 3], [6.35, ab[0], ab[1] + 3], [6.80, ab[0] + 60, ab[1] + 40], [11.0, ab[0] + 300, ab[1] + 220], [11.8, ab[0] + 302, ab[1] + 222]
  ];
  const cam = [
    [0.00, 640, 360, 1.00], [0.40, 640, 360, 1.00],
    [1.20, MX, br[1] + 60, 1.5], [5.60, MX, br[1] + 60, 1.5],   // add, type, Enter, Saving…, Saved, pinned as New
    [6.10, MX, br[1] + 80, 1.5], [10.8, MX, br[1] + 80, 1.5],   // duplicate rejected on the row, kept; Esc
    [11.6, 660, 360, 1.05], [11.8, 656, 360, 1.04]
  ];
  return { cam, cur };
}

const caret = t => Math.floor(t * 2.5) % 2 === 0 ? '<span class="c"></span>' : '<span class="c" style="opacity:0"></span>';
const typed = (s, t, a, b) => s.slice(0, Math.round(s.length * span(t, a, b)));

function render(t) {
  $("addB").style.background = (t >= T.add1 - .05 && t < T.add1 + .15) || (t >= T.add2 - .05 && t < T.add2 + .15) ? "#333" : "";

  // row 1: rogue-one
  const r1 = $("r1");
  r1.style.display = t >= T.add1 ? "" : "none";
  if (t < T.enter1) {
    r1.className = "ed";
    $("c1").innerHTML = `<span class="ein">${typed("rogue-one", t, ...T.type1)}${caret(t)}</span><span class="hint">Enter to save · Esc to cancel</span>`;
    $("u1").textContent = ""; $("s1").innerHTML = `<span class="st" style="color:var(--faint)">Enter to save · Esc to cancel</span>`;
  } else if (t < T.saved1) {
    r1.className = "ed";
    $("c1").innerHTML = `<span class="ein" style="border-color:var(--rule-strong)">rogue-one</span>`;
    $("u1").textContent = ""; $("s1").innerHTML = `<span class="st" style="color:var(--soft)">Saving…</span>`;
  } else {
    r1.className = t < T.saved1 + 1.2 ? "hl" : "";
    $("c1").innerHTML = `<span class="tgn"><i style="background:#a3a3a3"></i>rogue-one</span><span class="new">New</span>`;
    $("u1").textContent = "0 items"; $("s1").innerHTML = t < T.add2 ? `<span class="st"><svg><use href="#ok"/></svg>Saved</span>` : "";
  }

  // row 2: Hoth, a duplicate, rejected and kept until Esc
  const r2 = $("r2");
  r2.style.display = t >= T.add2 && t < T.esc2 ? "" : "none";
  const err = t >= T.err2;
  $("c2").innerHTML = `<span class="ein${err ? " err" : ""}">${t < T.enter2 ? typed("Hoth", t, ...T.type2) : "Hoth"}${caret(t)}</span>` +
    (err ? "" : `<span class="hint">Enter to save · Esc to cancel</span>`);
  $("s2").innerHTML = err ? `<span class="st e"><svg><use href="#no"/></svg>Hoth already exists. Use the existing tag?</span>` :
    t >= T.enter2 ? `<span class="st" style="color:var(--soft)">Checking…</span>` : `<span class="st" style="color:var(--faint)">Enter to save · Esc to cancel</span>`;
}

function events() {
  const ev = [["click", T.add1], ["key", T.enter1], ["chime", T.saved1], ["click", T.add2], ["key", T.enter2], ["pop", T.err2], ["key", T.esc2]];
  for (let i = 0; i < 5; i++) ev.push(["key", T.type1[0] + i * .18]);
  for (let i = 0; i < 3; i++) ev.push(["key", T.type2[0] + i * .17]);
  return ev;
}

Motion.scene({
  T, duration: 15, clicks: [T.add1, T.add2], build, render, events, clamp: false,
  slow: [[3.7, 5.6, 1.6], [8.2, 10.1, 1.8], [10.2, 10.9, 1.3]]
});
</script>
</body>
</html>
